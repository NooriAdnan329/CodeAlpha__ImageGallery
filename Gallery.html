<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noori.dev — Image Gallery</title>
  <meta name="description" content="A modern, responsive image gallery built with HTML, CSS, and Vanilla JS." />
  <link rel="stylesheet" href="./ImageGallery.css" />
</head>
<body>
  <!-- ============ HEADER ============ -->
  <header class="site-header glass">
    <div class="container header-inner">
      <a href="#" class="brand">
        <span class="brand-dot"></span>
        <h1>Noori<span>.dev</span></h1>
      </a>

      <div class="header-actions">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input id="searchInput" type="search" placeholder="Search images by title..." aria-label="Search images" />
        </div>

        <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ============ FILTER BAR ============ -->
    <div class="container toolbar">
      <nav class="categories" aria-label="Filter by category">
        <button class="chip active" data-category="all">All</button>
        <button class="chip" data-category="nature">Nature</button>
        <button class="chip" data-category="animals">Animals</button>
        <button class="chip" data-category="technology">Technology</button>
        <button class="chip" data-category="travel">Travel</button>
      </nav>

      <div class="filter-wrap">
        <label for="filterSelect" class="sr-only">Image filter</label>
        <select id="filterSelect" class="select" title="Apply visual filter">
          <option value="none">No filter</option>
          <option value="grayscale">Grayscale</option>
          <option value="sepia">Sepia</option>
          <option value="warm">Warm</option>
          <option value="cool">Cool</option>
          <option value="vivid">Vivid</option>
        </select>
        <span id="counter" class="counter" aria-live="polite">0 images</span>
      </div>
    </div>
  </header>

  <!-- ============ GALLERY ============ -->
  <main class="container main">
    <!-- Loading skeleton shown while gallery initializes -->
    <div id="loader" class="loader" aria-hidden="true">
      <div class="spinner"></div>
      <p>Loading gallery…</p>
    </div>

    <!-- Grid container — populated by JS -->
    <section id="gallery" class="gallery" aria-label="Image gallery"></section>

    <!-- Empty state -->
    <div id="empty" class="empty hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="9" cy="9" r="2"/>
        <path d="m21 15-5-5L5 21"/>
      </svg>
      <h3>No images found</h3>
      <p>Try a different search term or category.</p>
    </div>
  </main>

  <!-- ============ LIGHTBOX ============ -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">&#10094;</button>
    <figure class="lb-figure">
      <img id="lbImage" alt="" />
      <figcaption>
        <h4 id="lbTitle"></h4>
        <p id="lbMeta"></p>
        <div class="lb-filters" id="lbFilters" role="toolbar" aria-label="Apply filter to this image">
          <button class="lb-filter-btn active" data-filter="none">Original</button>
          <button class="lb-filter-btn" data-filter="grayscale">Grayscale</button>
          <button class="lb-filter-btn" data-filter="sepia">Sepia</button>
          <button class="lb-filter-btn" data-filter="warm">Warm</button>
          <button class="lb-filter-btn" data-filter="cool">Cool</button>
          <button class="lb-filter-btn" data-filter="vivid">Vivid</button>
        </div>
      </figcaption>
    </figure>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next">&#10095;</button>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>Built with HTML, CSS &amp; JS &middot; Noori.dev</p>
    </div>
  </footer>

  <script src="./ImageGallery.js"></script>
</body>
</html>
